# ============================================================
# SOP 流程平台 - 应用配置
# ============================================================

server:
  port: 8088

spring:
  application:
    name: sop-process-platform

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/sop_process?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis 配置（预留）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sop.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 视觉服务配置
vision:
  service:
    enabled: true            # 本地纯Java测试设为false，联调Python时设为true
    base-url: http://localhost:5000
    connect-timeout: 5000
    read-timeout: 30000

# SOP 业务配置
sop:
  mq:
    enabled: true               # MQ 开关（false=本地不启动 MQ 时不影响主流程）
    exchange: sop.process.exchange
    event-queue: sop.process.event.queue
    vision-retry-queue: sop.vision.retry.queue
    dead-letter-exchange: sop.dlx.exchange
    dead-letter-queue: sop.dead.letter.queue
    max-retry: 3
  timeout:
    check-interval: 6000000       # 超时检测间隔（毫秒），默认60秒
    step-multiplier: 2.0        # 步骤超时倍数（standardDuration * multiplier），默认2倍

# SpringDoc / Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.sop

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-footer: false
