# ============================================================
# SOP 流程平台 - 应用配置
# ============================================================

server:
  port: 8088

spring:
  application:
    name: sop-process-platform

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/sop_process?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis 配置（预留）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sop.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 视觉服务配置
vision:
  service:
    enabled: false            # 本地纯Java测试设为false，联调Python时设为true
    base-url: http://localhost:5000
    connect-timeout: 5000
    read-timeout: 30000

# SpringDoc / Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.sop

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-footer: false
